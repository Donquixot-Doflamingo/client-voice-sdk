name: Build Android test APK

# Builds the Expo test app (with the Kotlin SDK compiled in) on GitHub's runners,
# so nobody needs Android Studio locally. Push to GitHub, then download the
# "VoiceTestApp-debug-apk" artifact from the Actions tab and install it on a phone.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/VoiceTestApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install JS dependencies (also fetches the sherpa-onnx AAR via postinstall)
        run: npm install --no-audit --no-fund
        env:
          SHERPA_FETCH_PLATFORM: android

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceTestApp-debug-apk
          path: apps/VoiceTestApp/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  jvm:
    # Desktop CLI + proxy, built with plain kotlinc (no Gradle needed).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install kotlinc
        run: |
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.2.21/kotlin-compiler-2.2.21.zip
          unzip -q /tmp/kotlin.zip -d /opt
          echo "/opt/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Build CLI + proxy
        run: scripts/build-jvm.sh
      - name: Smoke test (JSON parsing, config, language detection)
        run: bin/indicvoice caps --json | head -c 2000
      - uses: actions/upload-artifact@v4
        with:
          name: indicvoice-cli-jars
          path: |
            build/indicvoice-cli.jar
            build/indicvoice-proxy.jar
